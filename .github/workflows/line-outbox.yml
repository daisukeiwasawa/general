name: Send LINE from outbox

# outbox/message.txt が push されたら、その中身を LINE に送る。
# 本文の先頭に「To: 宛先名」の行があれば、その宛先へ送る。
# Claude は Actions を起動する権限を持たないが push はできるため、
# 「ファイルを書いて push する」だけで LINE に送信できるようにする仕組み。
on:
  push:
    paths:
      - "outbox/message.txt"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          LINE_TARGETS: ${{ secrets.LINE_TARGETS }}
        run: |
          if [ ! -s outbox/message.txt ]; then
            echo "outbox/message.txt が空のため送信しません。"
            exit 0
          fi
          python scripts/line_send.py --parse-header < outbox/message.txt
